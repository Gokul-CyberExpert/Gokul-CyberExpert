name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Gokul-CyberExpert
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00ffff&color_dots=#0d1117,#0c2d48,#145da0,#2e8bc0,#00ffff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff00ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
