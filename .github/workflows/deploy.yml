name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create dist directory
        run: |
          mkdir -p dist
          # Copy README as index.html
          if [ -f "README.md" ]; then
            cp README.md dist/index.html
          fi
          # Copy profile cards if directory exists
          if [ -d "profile-summary-card-output" ]; then
            cp -r profile-summary-card-output dist/cards
          else
            mkdir -p dist/cards
            echo "Note: profile-summary-card-output directory not found"
          fi
          # Verify dist directory structure
          echo "Contents of dist directory:"
          ls -la dist/

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
