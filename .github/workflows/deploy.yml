name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to your default branch if different

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'  # Optional: caches npm dependencies

      - name: Install dependencies
        run: npm ci  # or npm install

      - name: Build project
        run: npm run build  # Change this to your build command

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist  # Change to your build output directory (e.g., build, public, out)
          commit_message: "Deploy to GitHub Pages"
          jekyll: false  # Set to true if using Jekyll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
